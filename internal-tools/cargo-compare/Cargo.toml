[package]
name = "cargo-compare"
version = "0.1.0"
authors = ["Rain <rain1@fb.com>"]
edition = "2018"
publish = false

[dependencies]
anyhow = "1.0.104"
cargo = { version = "0.99.0", features = ["vendored-libgit2"] }
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = { version = "0.6.5", default-features = false }
diffus = "0.10.0"
either = "1.18.0"
fs_extra = "1.3.0"
itertools.workspace = true
guppy = { path = "../../guppy" }
guppy-cmdlib = { path = "../../guppy-cmdlib", features = ["proptest1"] }
tempfile = "3.27.0"
once_cell = "1.21.4"
pathdiff = "0.2.3"
proptest = "1.11.0"
