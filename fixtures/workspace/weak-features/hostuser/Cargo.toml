[package]
name = "hostuser"
version = "0.1.0"
authors = ["Fake Author <fakeauthor@example.com>"]
edition = "2018"

# hostuser is a required build dependency of main, so activating this optional
# dependency builds normaldep on the host without going through main's own
# optional build declaration.
[dependencies]
normaldep = { path = "../normaldep", optional = true }
