[package]
name = "hakari"
version = "0.17.9"
description = "Manage workspace-hack packages that do feature unification inside workspaces."
documentation = "https://docs.rs/hakari"
edition = "2024"
repository = "https://github.com/guppy-rs/guppy"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = [
    "cargo",
    "dependencies",
    "workspace-hack",
    "feature-unification",
    "guppy",
]
categories = ["development-tools"]
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=doc_cfg"]

[package.metadata.release]
pre-release-replacements = [
    { file="CHANGELOG.md", search="Unreleased", replace="[{{version}}]", min=1 },
    { file="CHANGELOG.md", search="ReleaseDate", replace="{{date}}", min=1 },
    { file="CHANGELOG.md", search="<!-- next-header -->", replace="<!-- next-header -->\n## Unreleased - ReleaseDate\n", exactly=1 },
    { file="CHANGELOG.md", search="<!-- next-url -->", replace="<!-- next-url -->\n[{{version}}]: https://github.com/guppy-rs/guppy/releases/tag/{{crate_name}}-{{version}}", exactly=1 },
]

[lints]
workspace = true

[dependencies]
ahash = "0.8.12"
atomicwrites = "0.4.4"
camino = "1.2.5"
cfg-if = "1.0.4"
debug-ignore = "1.0.5"
diffy = { version = "0.5.1", features = ["color", "std"] }
guppy = { version = "0.17.26", path = "../../guppy", features = ["rayon1"] }
iddqd.workspace = true
include_dir = { version = "0.7.4", features = ["glob"], optional = true }
indenter = "0.3.4"
itertools.workspace = true
owo-colors = { version = "4.3.0", optional = true }
pathdiff = { version = "0.2.3", features = ["camino"] }
proptest = { version = "1.11.0", optional = true }
proptest-derive = { version = "0.8.0", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
tabular = { version = "0.2.0", features = ["ansi-cell"], optional = true }
target-spec = { version = "3.6.0", path = "../../target-spec" }
toml = { version = "1.1.4", optional = true }
toml_edit = "0.25.13"
twox-hash.workspace = true
guppy-workspace-hack.workspace = true

[dev-dependencies]
fixtures = { path = "../../fixtures" }

[features]
proptest1 = ["proptest", "proptest-derive", "guppy/proptest1"]
cli-support = [
    "guppy/summaries",
    "include_dir",
    "owo-colors",
    "serde",
    "tabular",
    "toml",
]
